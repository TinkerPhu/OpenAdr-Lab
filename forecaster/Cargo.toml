[package]
name = "lab-forecaster"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Publishes the exogenous forecasts of a site (PV from weather) as retained MQTT messages; the container behind openspec change lab-forecaster."

[lib]
name = "lab_forecaster"
path = "src/lib.rs"

[[bin]]
name = "lab-forecaster"
path = "src/main.rs"

[dependencies]
# Every forecast, payload and profile rule comes from this crate, shared with the VEN.
lab-forecast = { path = "../lab-forecast" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The broker session. Same version and no-TLS choice as the VEN's weather and measurement adapters
# (default-features off: rumqttc's "use-rustls" pulls a rustls-webpki with open advisories; this lab
# connects plaintext to its own Mosquitto).
rumqttc = { version = "0.25", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
