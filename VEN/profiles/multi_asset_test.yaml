# Test profile (W7): several assets of one kind — an east and a west PV array and two EVs,
# each planned, controlled and shown under its own id. Used by the test-ven-multi container
# (tests/docker-compose.test.yml) and ven_multi_asset.feature.
assets:
  - type: ev
    id: car-a
    max_charge_kw: 7.0
    initial_soc: 0.20
    battery_kwh: 60.0
  - type: ev
    id: car-b
    max_charge_kw: 11.0
    initial_soc: 0.40
    battery_kwh: 80.0
  - type: pv
    id: pv-east
    rated_kw: 4.0
    # Same site as the weather test fixture (Zunzgen, 47.4491/7.8081), facing east: its
    # derived forecast peaks in the morning.
    weather:
      latitude_deg: 47.4491
      longitude_deg: 7.8081
      tilt_deg: 30.0
      azimuth_deg: 90.0
      rated_kwp: 4.0
  - type: pv
    id: pv-west
    rated_kw: 4.0
    # Facing west: its derived forecast peaks in the afternoon.
    weather:
      latitude_deg: 47.4491
      longitude_deg: 7.8081
      tilt_deg: 30.0
      azimuth_deg: 270.0
      rated_kwp: 4.0
  - type: battery
    id: battery
    capacity_kwh: 10.0
    max_charge_kw: 5.0
    max_discharge_kw: 5.0
    initial_soc: 0.50
    round_trip_efficiency: 0.92
    min_soc: 0.10
  - type: base_load
    id: base_load
    baseline_kw: 0.5

simulator:
  tick_s: 1
  persist_every_s: 10

planner:
  plan_zones:
    - step_s: 3600   # 1 h slots, 24 h horizon — coarse for fast E2E solver runs
      slots: 24
  replan_interval_s: 300
