# WP6.3 (BL-09) BDD fixture: same shape as test.yaml, plus an active
# peak-demand penalty rule (10 kW threshold, 1-hour windows matching the
# plan_zones step below, 5 EUR/kW penalty rate).
assets:
  - type: ev
    id: ev
    max_charge_kw: 12.0
    initial_soc: 0.05
    battery_kwh: 60.0
  - type: heater
    id: heater
    max_kw: 3.0
    temp_initial_c: 20.0
    temp_min_c: 18.0
    temp_max_c: 23.0
  - type: pv
    id: pv
    rated_kw: 5.0
  - type: battery
    id: battery
    capacity_kwh: 10.0
    max_charge_kw: 5.0
    max_discharge_kw: 5.0
    initial_soc: 0.50
    round_trip_efficiency: 0.92
    min_soc: 0.10
  - type: base_load
    id: base_load
    baseline_kw: 0.5

simulator:
  tick_s: 1
  persist_every_s: 10
  report_interval_s: 10

planner:
  plan_zones:
    - step_s: 3600   # 1 h slots, 24 h horizon — coarse for fast E2E solver runs
      slots: 24
  replan_interval_s: 300
  penalty_rules:
    - rule_id: peak-10kw
      threshold_kw: 10.0
      measurement_window_s: 3600
      penalty_eur_per_kw: 5.0

weather_pv:
  latitude_deg: 47.4491
  longitude_deg: 7.8081
  tilt_deg: 30.0
  azimuth_deg: 180.0
  rated_kwp: 5.0

packets:
  - asset: ev
    target_soc: 0.80
    latest_end_h: 12.0
    comfort_rates:
      - fill: 0.0
        bid: 0.50
      - fill: 1.0
        bid: 0.05
