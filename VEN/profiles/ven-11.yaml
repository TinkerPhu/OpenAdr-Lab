# VEN-11: EV-only household, no PV/battery/heater
# Runs on a second physical host (VEN/scale_out/node2/ — see that
# directory's README.md for why), not the primary VTN host.
assets:
  - type: ev
    id: ev
    max_charge_kw: 11.0
    initial_soc: 0.30
    battery_kwh: 50.0
    soc_target: 0.80
    usage_sim:
      plan_ahead: false
      weekday:
        leave_time: "07:45:00"
        leave_jitter_min: 25.0
        return_time: "17:15:00"
        return_jitter_min: 25.0
        leave_probability: 1.0
        soc_drop_pct_mean: 55.0
        soc_drop_pct_stddev: 8.0
      weekend:
        leave_time: "10:30:00"
        leave_jitter_min: 60.0
        return_time: "17:00:00"
        return_jitter_min: 60.0
        leave_probability: 0.5
        soc_drop_pct_mean: 25.0
        soc_drop_pct_stddev: 5.0
      min_soc_after_drop_pct: 5.0
  - type: base_load
    id: base_load
    baseline_kw: 0.5
    spikes:
      - center_hour: 8.0
        amplitude_kw: 1.2
        duration_h: 0.25
        ramp_h: 0.03
        jitter_h: 0.2
        probability: 1.0
        weekdays: [0, 1, 2, 3, 4]      # coffee, weekdays
      - center_hour: 12.0
        amplitude_kw: 2.0
        duration_h: 0.5
        ramp_h: 0.05
        jitter_h: 0.25
        probability: 1.0
        weekdays: [0, 1, 2, 3, 4]      # lunch, weekdays
      - center_hour: 18.0
        amplitude_kw: 2.5
        duration_h: 0.75
        ramp_h: 0.08
        jitter_h: 0.3
        probability: 1.0
        weekdays: [0, 1, 2, 3, 4]      # dinner, weekdays
      - center_hour: 10.5
        amplitude_kw: 2.2
        duration_h: 1.0
        ramp_h: 0.1
        jitter_h: 0.5
        probability: 1.0
        weekdays: [5, 6]               # brunch, weekend
      - center_hour: 17.0
        amplitude_kw: 2.5
        duration_h: 0.83
        ramp_h: 0.08
        jitter_h: 0.3
        probability: 1.0
        weekdays: [5, 6]               # dinner, weekend (earlier than weekday)
      - center_hour: 20.0
        amplitude_kw: 0.4
        duration_h: 3.0
        ramp_h: 0.2
        jitter_h: 0.5
        probability: 1.0
        weekdays: []                    # TV/lights, every day

simulator:
  tick_s: 1
  persist_every_s: 15

planner:
  plan_zones:
    - step_s: 300
      slots: 96   # 8 h at 5-min resolution
    - step_s: 600
      slots: 96   # 16 h at 10-min resolution
    - step_s: 900
      slots: 96   # 24 h at 15-min resolution
