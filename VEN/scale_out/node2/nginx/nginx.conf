server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS and re-resolve every 10 s so VEN container
    # restarts don't leave nginx routing to stale IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ven-4/ {
        set $upstream_ven4 ven-4;
        rewrite ^/api/ven-4/(.*) /$1 break;
        proxy_pass http://$upstream_ven4:8080;
        proxy_set_header Host $host;
    }

    # This node has no local `bff` (that only runs on the primary VTN host),
    # so the VEN registry must be fetched from the primary host's real BFF
    # over the LAN instead of Docker DNS (contrast with VEN/ui/nginx.conf,
    # which proxies to `bff:8090`). See docs/history/project_journal.md,
    # "Node2 — a second Node1 extending the fleet" for why this diverges.
    #
    # Unlike docker-compose.yml (where docker compose itself substitutes
    # ${PRIMARY_HOST_LAN_IP} from .env), plain nginx config files are not
    # env-var-templated at container start — this IP must be a literal here.
    # If the primary host's LAN IP changes, update it in both this file and
    # .env in the same commit.
    location = /api/vens-registry {
        proxy_pass http://192.168.1.103:8220/api/vens;
        proxy_set_header Host $host;
    }

    location ~ ^/api/dyn/(?<ven>[a-zA-Z0-9_-]+)/(?<rest>.*)$ {
        proxy_pass http://$ven:8080/$rest$is_args$args;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
