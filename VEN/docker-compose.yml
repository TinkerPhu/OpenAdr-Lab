  ui:
    build:
      # Repo root: this UI is an npm workspace and imports ui-charts/ (D-06's
      # move applied to the UIs).
      context: ..
      dockerfile: VEN/ui/Dockerfile
    restart: unless-stopped
    ports:
      - "8214:80"
    networks:
      - vtn_openadr-net

networks:
  vtn_openadr-net:
    external: true
