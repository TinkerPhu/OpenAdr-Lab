      # is not part of a monitored fleet", which is why the variable exists at
      # all rather than a boolean.
      FLEET_MQTT_HOST: "lab-mqtt"
      FLEET_MQTT_PORT: "1884"
      FLEET_MQTT_USERNAME: "ven-2"
      FLEET_MQTT_PASSWORD: "${MQTT_FLEET_PW_VEN_2}"
      CLIENT_ID: "ven-2"
      CLIENT_SECRET: "ven-2"
      VEN_NAME: "ven-2"
      POLL_EVENTS_SECS: "30"
      POLL_PROGRAMS_SECS: "300"
      PERSIST_PATH: "/data/state.json"
      PROFILE_PATH: "/config/profile.yaml"
      RUST_LOG: "info"
      WEATHER_MQTT_HOST: "host.docker.internal"
      WEATHER_MQTT_SITE_ID: "zunzgen"
    volumes:
      - ./data/ven-2:/data
      - ./profiles/ven-2.yaml:/config/profile.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: curl --fail http://127.0.0.1:8080/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - vtn_openadr-net

  ven-3:
