###############################################################################
# OpenADR 3 VEN Stack — Docker Compose
#
# Deploys VEN containers that connect to the running VTN.
#
# Prerequisites:
#   - VTN stack must be running (see VTN/docker-compose.yml)
#   - VEN OAuth credentials must be loaded in VTN DB fixtures
#
# Usage:
#   docker compose up -d ven-1
#   curl http://localhost:8211/health
#
# Scale to multiple VENs:
#   docker compose up -d ven-1 ven-2 ven-3
###############################################################################

services:
  ven-1:
    build:
      context: ..
      dockerfile: VEN/Dockerfile
    restart: unless-stopped
    ports:
      - "8211:8080"
    env_file:
      - path: .env.fleet
        required: false
    environment:
      LISTEN_ADDR: "0.0.0.0:8080"
      VTN_BASE_URL: "http://vtn:3000"
      # Live fleet telemetry (phase 0 §6.2). The lab's own broker, by service
      # name from inside the VTN stack's network. Unset would mean "this VEN
      # is not part of a monitored fleet", which is why the variable exists at
      # all rather than a boolean.
      FLEET_MQTT_HOST: "lab-mqtt"
      FLEET_MQTT_PORT: "1884"
      FLEET_MQTT_USERNAME: "ven-1"
      FLEET_MQTT_PASSWORD: "${MQTT_FLEET_PW_VEN_1}"
      CLIENT_ID: "ven-1"
      CLIENT_SECRET: "ven-1"
      VEN_NAME: "ven-1"
      POLL_EVENTS_SECS: "30"
      POLL_PROGRAMS_SECS: "300"
      PERSIST_PATH: "/data/state.json"
      PROFILE_PATH: "/config/profile.yaml"
      RUST_LOG: "info"
      # Weather forecast plugin (docs/architecture/weather_forecast.md).
      # Reaches the pre-existing, unrelated Node1 Mosquitto deployment
      # (/srv/docker/mosquitto, on its own external influxdb_network) via
      # its published host port rather than joining that network — keeps
      # this stack's compose self-contained. See extra_hosts below.
      WEATHER_MQTT_HOST: "host.docker.internal"
      WEATHER_MQTT_SITE_ID: "zunzgen"
      # Real-measurement plugin (docs/architecture/real_measurement_mqtt.md).
      # ven-1 only — real PV inverter + house-load meter at the Zunzgen site.
      # Same broker/host as the weather feed above.
      PV_MEASUREMENT_MQTT_HOST: "host.docker.internal"
      PV_MEASUREMENT_MQTT_SITE_ID: "zunzgen"
      BASE_LOAD_MEASUREMENT_MQTT_HOST: "host.docker.internal"
      BASE_LOAD_MEASUREMENT_MQTT_SITE_ID: "zunzgen"
    volumes:
      - ./data/ven-1:/data
      - ./profiles/ven-1.yaml:/config/profile.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: curl --fail http://127.0.0.1:8080/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - vtn_openadr-net

  ven-2:
    build:
      context: ..
      dockerfile: VEN/Dockerfile
    restart: unless-stopped
    ports:
