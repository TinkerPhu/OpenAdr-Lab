###############################################################################
# Cargo unit-test stack for the VEN backend (Rust).
#
# Named volumes (ven-cargo-registry, ven-cargo-git, ven-cargo-target) cache
# compiled artifacts between runs. First run compiles everything from scratch
# (~20 min on Node1 ARM64 due to HiGHS + aws-lc-rs C++ builds); subsequent
# runs only recompile changed files (~1-2 min).
#
# Usage (on Node1):
#   cd /srv/docker/openadr_lab
#   docker compose -f tests/docker-compose.ven-unit-test.yml run --build --rm ven-unit-test
#   docker compose -f tests/docker-compose.ven-unit-test.yml down
#
# --build ensures the image is rebuilt when VEN source changes.
# --rm removes the container but keeps the named volumes (cache survives).
#
# To wipe the cache and force a full recompile:
#   docker compose -f tests/docker-compose.ven-unit-test.yml down -v
#
# Coverage (opt-in, GB-30 in docs/BACKLOG.md — NOT part of the default suite):
#   docker compose -f tests/docker-compose.ven-unit-test.yml run --build --rm ven-coverage
#   report lands in ./coverage/ven/ on the docker host (tarpaulin-report.html + .json).
#   Uses its own cache volumes (ven-coverage-cargo-*), deliberately not shared with
#   ven-unit-test's — tarpaulin's instrumented build can't reuse a plain cargo-test
#   cache anyway, so sharing would just thrash both on every toggle.
###############################################################################

name: ven-unit-test

services:
  ven-unit-test:
    build:
      context: ../VEN
      dockerfile: ../tests/Dockerfile.ven-unit-test
    volumes:
      - ven-cargo-registry:/usr/local/cargo/registry
      - ven-cargo-git:/usr/local/cargo/git
      - ven-cargo-target:/app/target
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1500M

  ven-coverage:
    build:
      context: ../VEN
      dockerfile: ../tests/Dockerfile.ven-coverage
    volumes:
      - ven-coverage-cargo-registry:/usr/local/cargo/registry
      - ven-coverage-cargo-git:/usr/local/cargo/git
      - ven-coverage-cargo-target:/app/target
      - ./coverage/ven:/app/coverage
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1500M

volumes:
  ven-cargo-registry:
  ven-cargo-git:
  ven-cargo-target:
  ven-coverage-cargo-registry:
  ven-coverage-cargo-git:
  ven-coverage-cargo-target:
