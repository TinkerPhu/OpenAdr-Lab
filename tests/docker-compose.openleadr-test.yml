###############################################################################
# Cargo test stack for openleadr-rs (submodule)
#
# Usage (on Node1):
#   cd /srv/docker/openadr_lab
#   docker compose -f tests/docker-compose.openleadr-test.yml down   # ALWAYS run first
#   docker compose -f tests/docker-compose.openleadr-test.yml run --build --rm cargo-test
#   docker compose -f tests/docker-compose.openleadr-test.yml down
#
# Services:
#   db         — PostgreSQL (ephemeral)
#   vtn        — openleadr-rs VTN (triggers SQLx migrations)
#   seed       — loads test_user_credentials fixture after migrations
#   cargo-test — runs cargo test --workspace against the seeded stack
#
# Named volumes (cargo-registry, cargo-git, cargo-target) cache compiled
# artifacts between runs. First run is slow; subsequent runs are ~1-2 min.
###############################################################################

name: openadr-cargo-test

services:
  db:
    image: ghcr.io/tweedegolf/postgres:18
    environment:
      POSTGRES_USER: openadr
      POSTGRES_DB: openadr
      POSTGRES_PASSWORD: openadr
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openadr"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Throwaway broker. From 3.1 the VTN connects to MQTT at startup and exits
  # 101 if it cannot -- and because openleadr-rs tracks a `.env` carrying
  # MQTT_URL=mqtt://localhost:1883, read through dotenvy, "no broker
  # configured" does not mean "no broker attempted". Anonymous is fine for a
  # throwaway; :1884 keeps the convention that the VTN's notifier endpoint is
  # always :1884, test or production.
  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto-test.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: mosquitto_pub -h 127.0.0.1 -p 1884 -t healthcheck -m ping -q 0 || exit 1
      interval: 3s
      timeout: 3s
      retries: 10

  vtn:
    build:
      context: ../openleadr-rs
      dockerfile: vtn.Dockerfile
    environment:
      DATABASE_URL: postgres://openadr:openadr@db:5432/openadr
      RUST_LOG: warn
      MQTT_URL: mqtt://mosquitto:1884
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      MQTT_TOPIC_PREFIX: openadr-lab/vtn
      # Mandatory from 3.1 on: the VTN panics at startup without it when using
      # the internal OAuth provider. Discovery metadata only -- it plays no
      # part in signing -- so the in-stack address is the right answer here.
      OAUTH_TOKEN_URL: http://vtn:3000/auth/token
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      # busybox wget, not curl -- the 3.1 VTN runtime image has no curl, so a
      # curl healthcheck never turns healthy and every dependant times out.
      test: wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  seed:
    image: postgres:16-alpine
    depends_on:
      vtn:
        condition: service_healthy
    volumes:
      - ../openleadr-rs/fixtures:/fixtures:ro
    environment:
      PGPASSWORD: openadr
    # `users.sql` is what upstream's own CI loads (.github/workflows/checks.yml).
    # 3.1 renamed the old `test_user_credentials.sql` out of existence, so this
    # was failing with "No such file or directory" before any test ran.
    # ON_ERROR_STOP so a fixture that half-applies fails loudly rather than
    # leaving the suite to fail later on missing rows.
    # Idempotent on purpose. The database volume survives `down` (only `down -v`
    # removes it, which would also take the cargo caches and turn every run into
    # a ~25-minute cold build), so this fixture is loaded onto a database that
    # may already hold it. `users.sql` is plain INSERTs, so a second load fails
    # the whole script under ON_ERROR_STOP -- psql exit 3, before a single test
    # compiles. Clearing the two tables it fills makes re-running cheap and
    # keeps ON_ERROR_STOP meaningful for real failures.
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h db -U openadr -d openadr -c 'TRUNCATE user_credentials, \"user\" CASCADE' -f /fixtures/users.sql"

  cargo-test:
    build:
      context: ../openleadr-rs
      dockerfile: ../tests/Dockerfile.openleadr-test
    environment:
      DATABASE_URL: postgres://openadr:openadr@db:5432/openadr
      SQLX_OFFLINE: "true"
      RUST_BACKTRACE: "1"
      # The client integration tests (`openleadr-client/tests/basic-read.rs`)
      # build an **in-process** VTN, so they need the same environment the vtn
      # service has -- otherwise `AppState::new` reads openleadr-rs's tracked
      # `.env`, dials `mqtt://localhost:1883`, finds nothing inside this
      # container and panics with `Mqtt(TcpTlsConnectFailure)` before the test
      # body runs. Setting it on the `vtn` service alone is not enough: that is
      # a different process.
      MQTT_URL: mqtt://mosquitto:1884
      MQTT_USERNAME: ""
      MQTT_PASSWORD: ""
      MQTT_TOPIC_PREFIX: openadr-lab/vtn
      OAUTH_TOKEN_URL: http://vtn:3000/auth/token
    volumes:
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/app/target
    depends_on:
      seed:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1500M

volumes:
  cargo-registry:
  cargo-git:
  cargo-target:
