# Ephemeral test broker for the weather-forecast-plugin BDD scenarios.
# Isolated on the test-net bridge network, anonymous access is fine here —
# this is a throwaway broker for the test stack, not the production
# Node1 Mosquitto deployment (see TECHNICAL_DEBTS.md R-54 for that one).
# One throwaway broker stands in for both real ones, but it listens on both
# ports so the "port identifies the broker" convention still reads correctly
# here: :1883 is the house side (weather/measurement plugin scenarios), :1884
# is the lab side (the VTN's 3.1 subscription notifiers).
listener 1883
listener 1884
allow_anonymous true
persistence false
