# S-9 — Diurnal: a full real day's price curve (duck-curve shape: cheap
# midday from solar oversupply, expensive evening peak) plus a plausible
# evening import cap and a plausible midday export cap.
#
# MUST be launched with `--start-at <local midnight, as UTC>` (Europe/Zurich
# — the lab's real geo coordinates, docs/architecture/weather_forecast.md)
# and `--no-paired-baseline` (a 24h paired baseline would double this to
# 48h). The `at_minute` offsets below are wall-clock-from-midnight; the
# simulator's PV output tracks real solar position for this lab's actual
# location, so launching at any other time misaligns the scripted price/
# capacity steps against the real generation curve they're meant to line
# up with.
#
# Scenario intent (docs/guidelines/FLEET_EXPERIMENT_DESIGN.md): this is a
# causal/attribution scenario for `energy_business.tariff_response`, not an
# aggregate/system one -- it needs a controlled EV population, not the
# fleet's natural persona/asset-mix diversity. Also pass
# `--ev-session-mode BY_DEADLINE --ev-roster experiments/fleet_ev_roster.json
# --fleet-map experiments/fleet_map.json` (GB-37, docs/BACKLOG.md):
# --fleet-map is REQUIRED alongside --ev-session-mode (run_experiment.py
# errors up front if it's missing) -- setup_ev_roster_sessions needs each
# roster VEN's host/port from it. Without the whole flag set, every
# EV-bearing VEN's EV has no active session and sits inert
# (EvMilpMode::MustNotRun) for the whole run, which is exactly what produced
# the misleading tariff_response numbers in the first live S-9 run
# (docs/history/fleet_run_journal.md). `incompatible_ev_session_modes` below
# is enforced by run_experiment.py (check_ev_mode_compatible) -- OPPORTUNISTIC/
# ASAP_FREE are gated on PV surplus, not price, and would confound the
# result; this also blocks `--personas` from ever being usable here once its
# manifest pipeline covers this fleet, since its default persona mix leans
# on those same two modes.
name: s9_diurnal
description: 24h duck-curve price shape + evening import cap + midday export cap
tier: realistic
duration_minutes: 1440
incompatible_ev_session_modes: [OPPORTUNISTIC, ASAP_FREE]
actions:
  - at_minute: 0
    type: price_series
    # 00-04 overnight / 04-08 morning ramp / 08-12 morning peak demand /
    # 12-16 midday solar glut (cheapest) / 16-20 evening peak (priciest) /
    # 20-24 evening decline.
    values_eur_kwh: [0.15, 0.20, 0.28, 0.08, 0.40, 0.22]
    interval_minutes: 240
  - at_minute: 660          # 11:00 — through 16:00; ven-1/2/3's PV is azimuth_deg: 267
    type: export_capacity_limit  # (near-due-west), so its real peak lands mid-to-late
    export_kw: 6.0          # afternoon, not solar noon -- this 5h window is deliberately
    duration_minutes: 300   # wide enough to still cover that peak comfortably (unlike
                             # s10_overexport's narrow 30 min window, which needs a
                             # precisely-timed --start-at instead, see that file)
  - at_minute: 1080         # 18:00 — evening demand peak
    type: capacity_limit
    import_kw: 4.0           # above base-load-only VENs, below EV-charging-at-peak VENs
    duration_minutes: 240    # through 22:00
