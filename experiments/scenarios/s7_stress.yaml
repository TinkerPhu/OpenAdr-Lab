# S-7 — Stress: tight capacity limit overlapping a grid emergency alert.
name: s7_stress
description: Tight 1.5 kW capacity limit for 20 min, overlapping alert for 10 min
tier: stress
duration_minutes: 30
actions:
  - at_minute: 0
    type: price_series
    values_eur_kwh: [0.10, 0.45, 0.10]
    interval_minutes: 10
  - at_minute: 5
    type: capacity_limit
    import_kw: 1.5
    duration_minutes: 20
  - at_minute: 10
    type: alert
    alert_type: ALERT_GRID_EMERGENCY
    duration_minutes: 10
