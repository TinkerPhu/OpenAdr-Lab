# S-1 — Baseline: flat tariff, no DR signals. Every other scenario's
# "energy shifted" KPI is computed against this run's import profile.
name: s1_flat
description: Flat tariff baseline, no control signals
tier: realistic
# This scenario IS the fleet baseline, so run_batch.py gives it
# --no-paired-baseline -- pairing a baseline against its own baseline window
# only doubles its wall clock.
is_baseline: true
duration_minutes: 30
actions:
  - at_minute: 0
    type: price_series
    values_eur_kwh: [0.25, 0.25, 0.25]
    interval_minutes: 10
