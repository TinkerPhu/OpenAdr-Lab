[package]
name = "lab-forecast"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "The exogenous forecasts of a site (PV from weather, base load from history) and their MQTT payload contract, shared by the VEN and the lab-forecaster container."

[dependencies]
# Deliberately thin and free of VEN types: the VEN and the forecaster both depend on this crate so
# that one function answers "what will the PV and the base load do", the failure the
# one-concept-one-function rule exists for. Dependencies join as code moves in.
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The VEN UI's API types are generated from these types (`#[derive(TS)]`); same version and
# features as the VEN so the trait is one. A proc-macro; nothing runs at runtime. MIT.
ts-rs = { version = "12.0", features = ["chrono-impl", "uuid-impl", "serde-json-impl"] }
