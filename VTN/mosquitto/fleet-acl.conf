# Who may say what on the lab broker.
#
# Authentication alone only proves a client is *some* known client. Until this
# file existed every VEN shared one credential, so any VEN could publish under
# any other VEN's name: spoofed telemetry, spoofed trace, and a fleet view with
# no way to tell. Each VEN now has its own credential (derived — see
# scripts/gen_fleet_mqtt_secrets.py) and this pins it to its own subtree.
#
# Contains no secrets: usernames only, which is why it is committed while the
# password file is generated at start-up.
#
# Mosquitto's default for an authenticated user with no matching rule is deny,
# so anything not granted here is refused.

# The VTN's 3.1 subscription notifiers own their own root.
user openadr-vtn
topic readwrite openadr-lab/vtn/#

# The BFF reads the whole fleet and writes none of it. Read-only is the point:
# the BFF is a consumer of what the VENs say, and a bug here must not be able
# to invent a reading.
user openadr-bff
topic read openadr-lab/fleet/#

# One VEN, one subtree. `%u` is the connecting username, so this is one rule
# rather than twenty — and a twenty-first VEN needs no edit here at all, which
# is the same reason its password is derived rather than listed.
#
# Requires each VEN to authenticate as its own name (FLEET_MQTT_USERNAME =
# its venName); the pattern grants nothing to a client that does not.
pattern readwrite openadr-lab/fleet/%u/#
