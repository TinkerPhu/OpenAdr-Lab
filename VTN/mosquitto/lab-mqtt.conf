# Lab-only MQTT broker for the OpenADR lab.
#
# This is NOT the site's house broker. The two are split by direction of travel,
# not by topic prefix -- both use the `openadr-lab/` root:
#
#   house broker (Node1 :1883)  what the physical site MEASURES
#                               openadr-lab/measurement/<site>/{pv,base_load,boiler_power}
#                               openadr-lab/weather/<site>/forecast
#                               (alongside the house's own shellies/, hargassner/, weconnect/)
#
#   this broker  (Node1 :1884)  what the LAB GENERATES
#                               openadr-lab/vtn/...    OpenADR 3.1 subscription notifiers
#                               openadr-lab/fleet/...  per-VEN telemetry (fleet monitor)
#
# The VENs address every feed independently (`PV_MEASUREMENT_MQTT_HOST`,
# `BASE_LOAD_MEASUREMENT_MQTT_HOST`, `WEATHER_MQTT_HOST`, each with its own
# client id), so the measurement and weather feeds keep pointing at the house
# broker unchanged and no bridge between the two is needed.
#
# Why a separate broker at all: the house broker runs `allow_anonymous true`
# with a password file the house depends on, so the lab cannot tighten its auth
# without risking home automation (TECHNICAL_DEBTS.md R-54). Here the lab owns
# the policy outright -- which is what OpenADR 3.1's native MQTT notifiers and
# any later certification profile need.

listener 1883

# No anonymous access -- every client authenticates. This is the whole point of
# running our own broker, and it is why R-54 can be closed for lab traffic.
allow_anonymous false
password_file /mosquitto/config/pwfile

# The password file is generated at container start from environment variables
# (see the `lab-mqtt` service in VTN/docker-compose.yml) so that no credential,
# hashed or otherwise, is ever committed to this public repository.

persistence true
persistence_file mosquitto.db
persistence_location /mosquitto/data/

# `information` keeps connect/disconnect and subscription events visible, which
# is what makes a silent notifier failure diagnosable. `all` would add every
# published message and drown the log at fleet telemetry rates.
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
