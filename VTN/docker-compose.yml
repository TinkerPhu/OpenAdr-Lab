###############################################################################
# OpenADR 3 VTN Stack — Docker Compose
#
# Based on: openleadr-rs upstream docker-compose + vtn_setup_from_blog guide
#
# Prerequisites:
#   1. Clone the openleadr-rs repo into the project root (one level up):
#      cd .. && git clone https://github.com/OpenLEADR/openleadr-rs.git
#
#   2. Copy .env.example to .env (or use defaults)
#
# Usage:
#   # Step 1: Start the database first
#   docker compose up -d db
#
#   # Step 2: Wait for healthy, then start the VTN
#   docker compose up -d vtn
#
#   # Step 3: Verify
#   curl http://localhost:8200/health
#
# To rebuild after upstream changes:
#   docker compose up --force-recreate --build --no-deps vtn
###############################################################################

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL — VTN persistence
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-openadr}
      POSTGRES_DB: ${PG_DB:-openadr}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-openadr}
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: ${PG_TZ:-UTC}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openadr"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${PG_PORT:-8201}:5432"
    volumes:
      - ./data/db:/var/lib/postgresql/data
    networks:
      - openadr-net

  # ---------------------------------------------------------------------------
  # VTN — openleadr-rs server
  # Built from the cloned openleadr-rs repository (./openleadr-rs)
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # lab-mqtt — the lab's own MQTT broker (see VTN/mosquitto/lab-mqtt.conf).
  #
  # Separate from the site's house broker, which carries real-hardware feeds and
  # runs allow_anonymous for the house. This one carries what the lab generates
  # (3.1 subscription notifiers, fleet telemetry) and authenticates every client.
  #
  # It listens on 1884 everywhere -- container, docker network and host -- so the
  # port alone identifies the broker: :1883 is always the house broker, :1884 is
  # always this one. The VTN and the Node1 VENs reach it by name as
  # lab-mqtt:1884; the Node2 fleet uses the identical port on the host.
  #
  # The password file is written at start-up from these variables so that no
  # credential is committed to this public repository. Secrets default to the
  # lab convention of secret == client id, as bl-client and ven-N already do.
  # ---------------------------------------------------------------------------
  lab-mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${LAB_MQTT_PORT:-1884}:1884"
    environment:
      MQTT_VTN_USERNAME: ${MQTT_VTN_USERNAME:-openadr-vtn}
      MQTT_VTN_PASSWORD: ${MQTT_VTN_PASSWORD:-openadr-vtn}
    volumes:
      - ./mosquitto/lab-mqtt.conf:/mosquitto/config/mosquitto.conf:ro
      - lab-mqtt-data:/mosquitto/data
    command:
      - sh
      - -c
      - |
        set -e
        mosquitto_passwd -c -b /mosquitto/config/pwfile           "$${MQTT_VTN_USERNAME}" "$${MQTT_VTN_PASSWORD}"
        # The command runs as root, but mosquitto drops to the `mosquitto` user
        # on start; without this chown it cannot read its own password file and
        # exits with 'Unable to open pwfile'.
        chown mosquitto:mosquitto /mosquitto/config/pwfile
        chmod 0600 /mosquitto/config/pwfile
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    healthcheck:
      test: mosquitto_sub -h 127.0.0.1 -p 1884 -u "$${MQTT_VTN_USERNAME}" -P "$${MQTT_VTN_PASSWORD}" -t '$$SYS/broker/version' -C 1 -W 3 || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - openadr-net

  vtn:
    build:
      context: ../openleadr-rs
      dockerfile: vtn.Dockerfile
    restart: unless-stopped
    ports:
      - "${VTN_PORT:-8200}:3000"
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      DATABASE_URL: postgres://${PG_USER:-openadr}:${PG_PASSWORD:-openadr}@db:5432/${PG_DB:-openadr}
      # OAuth — internal provider (HMAC, auto-generated secret)
      # Set OAUTH_BASE64_SECRET for a fixed key; omit to let VTN generate one
      # (a fresh random secret per restart, which invalidates cached tokens —
      # clients re-authenticate, so this is noise rather than breakage).
      # OAUTH_TYPE: INTERNAL
      # OAUTH_KEY_TYPE: HMAC
      # OAUTH_BASE64_SECRET: ${OAUTH_BASE64_SECRET:-}
      #
      # Mandatory from OpenADR 3.1 on: the VTN panics at startup without it when
      # using the internal OAuth provider (state.rs:171). It is pure discovery
      # metadata — served from GET /auth/server to tell a client where to fetch
      # a token — and plays no part in signing or validating one. So it must be
      # a URL a *client* can reach, not the in-network service address: the BFF
      # and the Node1 VENs talk to vtn:3000, but the Node2 fleet reaches the
      # published port over the LAN, and that is the answer discovery must give.
      OAUTH_TOKEN_URL: ${OAUTH_TOKEN_URL:-http://192.168.1.103:8200/auth/token}
      #
      # MQTT — OpenADR 3.1 subscription notifiers (/notifiers/mqtt, push-mqtt).
      # All three of URL/USERNAME/PASSWORD must be set together: a partial set
      # is a startup panic, and so is an unreachable broker, because the VTN
      # loads its notifiers during state construction. Set explicitly here so
      # the value can never be inherited from openleadr-rs/.env via dotenvy,
      # which ships MQTT_URL=mqtt://localhost:1883.
      #
      # The lab's own broker, on this same network, so it is addressed by
      # service name -- no host.docker.internal and no extra_hosts entry, which
      # the house broker would have needed since it sits on influxdb_network.
      MQTT_URL: ${MQTT_URL:-mqtt://lab-mqtt:1884}
      MQTT_USERNAME: ${MQTT_VTN_USERNAME:-openadr-vtn}
      MQTT_PASSWORD: ${MQTT_VTN_PASSWORD:-openadr-vtn}
      MQTT_TOPIC_PREFIX: ${MQTT_TOPIC_PREFIX:-openadr-lab/vtn}
    healthcheck:
      test: curl --fail http://127.0.0.1:3000/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      # 3.1 loads subscription notifiers during state construction and panics if
      # the broker is unreachable, so this is a hard start-up ordering need.
      lab-mqtt:
        condition: service_healthy
    networks:
      - openadr-net

  # ---------------------------------------------------------------------------
  # BFF — Rust axum proxy between UI and VTN
  # ---------------------------------------------------------------------------
  bff:
    build: ./bff
    restart: unless-stopped
    ports:
      - "8220:8090"
    environment:
      BFF_LISTEN_ADDR: "0.0.0.0:8090"
      VTN_BASE_URL: "http://vtn:3000"
      VTN_BL_CLIENT_ID: "bl-client"
      VTN_BL_CLIENT_SECRET: "bl-client"
      # Phase 1 (A-2) VTN recorder — same Postgres instance as the VTN itself,
      # separate `lab_recorder` schema. bff already depends_on vtn:healthy,
      # which itself depends_on db:healthy, so db is guaranteed up by then.
      DATABASE_URL: postgres://${PG_USER:-openadr}:${PG_PASSWORD:-openadr}@db:5432/${PG_DB:-openadr}
      RUST_LOG: "info"
    healthcheck:
      test: curl --fail http://127.0.0.1:8090/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      vtn:
        condition: service_healthy
    networks:
      - openadr-net

  # ---------------------------------------------------------------------------
  # UI — React + nginx operator console
  # ---------------------------------------------------------------------------
  ui:
    build: ./ui
    restart: unless-stopped
    ports:
      - "8221:80"
    depends_on:
      bff:
        condition: service_healthy
    networks:
      - openadr-net

networks:
  openadr-net:
    driver: bridge

volumes:
  # Broker persistence: retained messages and queued QoS>0 sessions survive a
  # restart, so a VEN that reconnects does not silently miss notifications.
  lab-mqtt-data:
