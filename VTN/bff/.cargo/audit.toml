# Advisories the project has looked at and accepted; each one is a row in docs/BACKLOG.md with
# the reason and when to look again. `cargo audit` (also the CI runner's) fails on anything else.
[advisories]
ignore = [
    # rsa 0.9.10 (Marvin timing side channel): lockfile-only. It arrives through sqlx-mysql,
    # an optional driver the BFF never enables, so it is not compiled; no fixed release exists.
    "RUSTSEC-2023-0071",
    # libsqlite3-sys 0.30.1 (C SQLite CVE, RUSTSEC-2026-0459): lockfile-only. It arrives through
    # sqlx-sqlite, an optional driver the BFF never enables (`cargo tree -i libsqlite3-sys` prints
    # nothing), so it is not compiled. The VEN, which does compile it, moved to rusqlite 0.41.
    "RUSTSEC-2026-0459",
]
