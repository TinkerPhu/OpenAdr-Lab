[package]
name = "vtn-bff"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "request-id", "propagate-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Phase 1 (A-2) VTN recorder — writes to the existing openleadr-rs Postgres
# instance under schema `lab_recorder`, never touching its own tables.
# MIT/Apache-2.0, no new system dependency (pure-Rust rustls TLS backend).
# Subscribing to the fleet's live telemetry. Same client the VEN publishes
# with, so both ends of openadr-lab/fleet/ agree about the protocol.
# default-features = false drops rumqttc's rustls stack. The BFF speaks plain
# TCP to lab-mqtt on the docker network -- there is no TLS transport anywhere in
# fleet.rs -- so the TLS code was compiled, never executed, and still carried
# four rustls-webpki advisories (RUSTSEC-2026-0049/0098/0099/0104) that rumqttc
# 0.25.1, the latest release, pins to a version predating the fixes. Not
# compiling a stack we do not use is the fix; suppressing the advisories would
# only have hidden it.
rumqttc = { version = "0.25", default-features = false }
# The rules the BFF must not answer differently from the VEN: how a time
# series is resampled onto a grid, and when an interval runs (D-06). A path
# dependency, which is why this crate's Docker build context is the repo root.
lab-core = { path = "../../lab-core" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json"] }

[dev-dependencies]
# `test-util` lets a test run tokio's clock paused, so the fleet switch's spacing is
# asserted in virtual time instead of slept through.
tokio = { version = "1", features = ["full", "test-util"] }

# `ci`: the profile the E2E test images build with (tests/docker-compose.test.yml).
# Only our own crates drop to opt-level 1 and build incrementally, so a source edit
# recompiles quickly; every dependency -- HiGHS (C++, built by cmake from this
# opt-level) and the rest of the solver path -- keeps release optimisation.
# Production images build `release`.
[profile.ci]
inherits = "release"
opt-level = 1
incremental = true
codegen-units = 256

[profile.ci.package."*"]
opt-level = 3

[profile.ci.package.lab-core]
opt-level = 1
