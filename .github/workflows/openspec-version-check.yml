name: OpenSpec version check

# Weekly, because openspec ships often and its skills are committed here: the
# `generatedBy` in .claude/skills/openspec-*/SKILL.md silently ages until
# somebody happens to run `openspec update`.
#
# 06:37 on Mondays rather than a round hour — GitHub queues every job that asked
# for :00, and a check nobody is waiting on may as well let those through first.
on:
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch: # run it on demand from the Actions tab

# Only to file the finding. Nothing here touches code.
permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Compare the committed skills against the published release
        id: check
        run: |
          set +e
          python3 scripts/check_openspec_version.py --json > result.json
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat result.json
          echo "current=$(jq -r .current result.json)" >> "$GITHUB_OUTPUT"
          echo "latest=$(jq -r .latest result.json)" >> "$GITHUB_OUTPUT"

      # An unreachable registry is not "up to date". Fail loudly, so a silently
      # broken check cannot masquerade as a passing one for months.
      - name: Fail if the check could not run
        if: steps.check.outputs.status == '2'
        run: |
          echo "::error::openspec version check could not run — see the step above."
          exit 1

      - name: Open an issue when an update is available
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          TITLE="openspec $LATEST is available (skills generated by $CURRENT)"
          # One issue per version, not one per week: re-filing the same reminder
          # every Monday trains everyone to ignore it.
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING is already open for $LATEST — nothing to do."
            exit 0
          fi
          envsubst < .github/openspec-update-issue.md > body.md
          gh issue create --title "$TITLE" --body-file body.md
