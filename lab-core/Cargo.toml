[package]
name = "lab-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Rules the VEN and the VTN's BFF must agree on: when an interval runs, and how a time series is resampled."

[dependencies]
# Deliberately thin. This crate exists so two services cannot disagree about
# the same rule, which only holds if depending on it is cheap enough that
# nobody is tempted to re-implement instead.
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openleadr-wire = { git = "https://github.com/TinkerPhu/openleadr-rs.git", rev = "da565b445cab8eb0e04e8476c756e2a3e009d312" }
